<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tetris</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="wrapper">
    <h1 class="game-title">TETRIS</h1>
    <div class="game-container">
      <canvas id="board" width="300" height="600"></canvas>

      <aside class="panel">
        <div class="panel-section">
          <span class="label">SCORE</span>
          <span class="value" id="score">0</span>
        </div>
        <div class="panel-section">
          <span class="label">LINES</span>
          <span class="value" id="lines">0</span>
        </div>
        <div class="panel-section">
          <span class="label">LEVEL</span>
          <span class="value" id="level">1</span>
        </div>

        <div class="panel-section" id="hs-panel">
          <span class="label">HIGH SCORES</span>
          <ol id="hs-list"></ol>
          <div class="hs-stats">
            <span>Mejor combo: <strong id="hs-best-combo">0</strong></span>
            <span>Máx. líneas: <strong id="hs-max-lines">0</strong></span>
          </div>
          <button id="hs-reset-btn">Borrar records</button>
        </div>

        <div class="panel-section">
          <span class="label">NEXT</span>
          <canvas id="next-canvas" width="120" height="120"></canvas>
        </div>

        <div class="panel-section" id="thm-panel">
          <span class="label">THEME</span>
          <select id="thm-select">
            <option value="retro">Retro</option>
            <option value="neon">Neon</option>
            <option value="pastel">Pastel</option>
            <option value="pixel">Pixel Art</option>
          </select>
        </div>

        <div class="panel-section controls">
          <span class="label">CONTROLS</span>
          <ul>
            <li><kbd>←</kbd><kbd>→</kbd> mover</li>
            <li><kbd>↑</kbd> rotar</li>
            <li><kbd>↓</kbd> bajar</li>
            <li><kbd>Space</kbd> caída</li>
            <li><kbd>P</kbd> pausa</li>
          </ul>
        </div>
      </aside>
    </div>

    <div id="overlay" class="overlay hidden">
      <div class="overlay-box">
        <p id="overlay-title">GAME OVER</p>
        <p id="overlay-score"></p>
        <div id="hs-gameover" hidden>
          <ol id="hs-gameover-list"></ol>
          <input id="hs-name-input" type="text" maxlength="10" placeholder="Tu nombre">
          <button id="hs-save-btn">Guardar</button>
        </div>
        <button id="restart-btn">Reiniciar</button>

        <div id="pm-menu">
          <button id="pm-resume-btn">Reanudar</button>
          <button id="pm-controls-btn">Ver controles</button>
          <ul id="pm-controls-list" hidden>
            <li><kbd>←</kbd><kbd>→</kbd> mover</li>
            <li><kbd>↑</kbd> rotar</li>
            <li><kbd>↓</kbd> bajar</li>
            <li><kbd>Space</kbd> caída</li>
            <li><kbd>P</kbd> / <kbd>Esc</kbd> pausa</li>
          </ul>
          <label id="pm-level-label" for="pm-level-select">Nivel inicial</label>
          <select id="pm-level-select"></select>
          <button id="pm-restart-btn">Reiniciar</button>
        </div>
      </div>
    </div>
  </div>

  <script src="game.js"></script>
</body>
</html>
